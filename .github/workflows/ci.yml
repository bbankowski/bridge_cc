name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Unit tests with coverage
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=json-summary
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              console.log("### Coverage\n\n| | % |\n|---|---|");
              for (const k of ["statements", "branches", "functions", "lines"]) console.log(`| ${k} | ${t[k].pct} |`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run build
